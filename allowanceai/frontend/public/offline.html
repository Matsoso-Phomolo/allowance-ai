<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>AllowanceAI Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #172033;
        display: grid;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #fff;
        border: 6px solid #1d4ed8;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
        display: grid;
        gap: 14px;
        margin: 0 auto;
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      h1 {
        font-size: clamp(2.4rem, 11vw, 4rem);
        line-height: 1;
        margin: 0;
      }

      p {
        color: #526079;
        font-weight: 700;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AllowanceAI</h1>
      <p>You are offline. Reconnect to use budgets, expenses, reports, and AI planning.</p>
    </main>
  </body>
</html>
